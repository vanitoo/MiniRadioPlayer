name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "main.py"
      - "requirements.txt"
      - "build.bat"
      - "build_icon.py"
      - "assets/**"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build MiniRadioPlayer.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Generate Windows icon
        shell: pwsh
        run: |
          python build_icon.py

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --noconsole --onefile --name MiniRadioPlayer --icon assets/MiniRadioPlayer.ico --add-data "assets/MiniRadioPlayer.ico;assets" --add-data "assets/MiniRadioPlayer.svg;assets" main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniRadioPlayer-windows
          path: dist/MiniRadioPlayer.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/MiniRadioPlayer.exe#MiniRadioPlayer.exe" `
            --repo "${{ github.repository }}" `
            --title "MiniRadioPlayer ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
